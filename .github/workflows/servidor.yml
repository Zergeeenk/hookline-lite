# Hookline (servicio): tests en SQLite y Postgres + build de la imagen de Docker, en cada push y PR.
name: servidor

on:
  push:
    branches: [main]
    paths: ["servidor/**", ".github/workflows/servidor.yml"]
  pull_request:
    paths: ["servidor/**", ".github/workflows/servidor.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: hookline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servidor/pyproject.toml
      - name: ffmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-inter
      - name: Dependencias
        run: pip install -e ".[dev]"
      - name: Tests
        env:
          HOOKLINE_TEST_BD: ${{ matrix.base == 'postgres' && 'postgresql+psycopg://postgres:prueba@localhost:5432/hookline' || '' }}
        run: python -m pytest -q
      - name: Migraciones (Alembic) en Postgres
        if: matrix.base == 'postgres'
        env:
          HOOKLINE_BASE_DATOS: postgresql+psycopg://postgres:prueba@localhost:5432/hookline
          HOOKLINE_DATOS: /tmp/hl
        run: |
          python -c "from hookline import db, modelos; db.Base.metadata.drop_all(db.motor())"
          hookline db migrar

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t hookline:ci servidor
      - name: Arranca y responde
        run: |
          docker run -d --name hl -p 8000:8000 \
            -e HOOKLINE_CLAVE_SECRETA=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())") \
            -e HOOKLINE_CLAVE_SESION=ci-clave-de-sesion-123 hookline:ci api
          for i in $(seq 1 30); do curl -sf localhost:8000/api/salud && exit 0; sleep 2; done
          docker logs hl; exit 1

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hookline"
version = "0.1.0"
description = "Hookline: community manager de Instagram multi-cuenta (servicio)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "anthropic>=2.0",
  "Pillow>=10.0",
  "fonttools>=4.40",
  "imageio-ffmpeg>=0.5",
  "yt-dlp>=2026.10",
  "opencv-python-headless>=4.8",
  "boto3>=1.34",
]

[project.optional-dependencies]
buscador = ["playwright>=1.50"]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
hookline = "hookline.cli:main"

[tool.setuptools.packages.find]
include = ["hookline*"]

[tool.setuptools.package-data]
hookline = ["panel/*.html", "migraciones/*.py", "migraciones/*.mako", "migraciones/versions/*.py", "alembic.ini", "ia/*.md", "emojis/*.json", "emojis/*.txt",
            "emojis/3d/*.webp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

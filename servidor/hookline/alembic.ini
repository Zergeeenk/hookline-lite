# Lo usa `hookline db migrar` (la URL sale de HOOKLINE_BASE_DATOS, no de acá).
[alembic]
script_location = %(here)s/migraciones

[loggers]
keys = root
[handlers]
keys = consola
[formatters]
keys = simple
[logger_root]
level = WARN
handlers = consola
[handler_consola]
class = StreamHandler
args = (sys.stderr,)
formatter = simple
[formatter_simple]
format = %(levelname)s %(name)s: %(message)s

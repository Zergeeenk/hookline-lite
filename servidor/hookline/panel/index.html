<style>
:root {
  --bg: #fff6f9; --sf: #ffffff; --sf2: #fff0f5; --sf3: #ffe4ee; --bd: #f6d6e2; --bd2: #efc2d3;
  --tx: #2b1a22; --tx2: #7d6170; --tx3: #a88c99;
  --ac: #e8467c; --ac2: #ff7aa8; --acs: rgba(232, 70, 124, .10); --act: #ffffff;
  --ok: #17935b; --oks: rgba(23, 147, 91, .12); --warn: #c77c12; --warns: rgba(217, 138, 28, .14);
  --err: #d23f4f; --errs: rgba(210, 63, 79, .12); --info: #5b6cf0; --infos: rgba(91, 108, 240, .12);
  --sh: 0 1px 2px rgba(120, 30, 70, .05), 0 10px 30px rgba(120, 30, 70, .07);
  --sh2: 0 20px 60px rgba(80, 10, 40, .22);
  --r: 16px; --r2: 12px; --r3: 10px;
  --side: 248px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #121014; --sf: #1b171e; --sf2: #231d27; --sf3: #2d2432; --bd: #332938; --bd2: #43364a;
  --tx: #f7eef3; --tx2: #bba5b2; --tx3: #8c7884;
  --ac: #ff5c93; --ac2: #ff8bb3; --acs: rgba(255, 92, 147, .14); --act: #1a0c12;
  --ok: #3ccf8e; --oks: rgba(60, 207, 142, .13); --warn: #f0a940; --warns: rgba(240, 169, 64, .14);
  --err: #ff6b7a; --errs: rgba(255, 107, 122, .13); --info: #8d9bff; --infos: rgba(141, 155, 255, .14);
  --sh: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
  --sh2: 0 20px 60px rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--tx); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; transition: background .25s, color .25s; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--ac); }
.i { width: 18px; height: 18px; flex: none; vertical-align: -4px; }
.i.sm { width: 15px; height: 15px; vertical-align: -3px; }
.spin { animation: girar 1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
@keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- estructura ---------- */
.app { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 14px; padding: 18px 14px; background: var(--sf); border-right: 1px solid var(--bd); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.logo { width: 34px; height: 34px; border-radius: 10px; overflow: hidden; flex: none; box-shadow: 0 4px 14px rgba(232, 70, 124, .35); }
.logo svg { width: 100%; height: 100%; display: block; }
.brand b { font-size: 16px; letter-spacing: -.02em; display: block; }
.brand small { color: var(--tx3); font-size: 11.5px; }
nav.menu { display: flex; flex-direction: column; gap: 2px; }
.nv { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px; border: 0; background: none; cursor: pointer; color: var(--tx2); font-weight: 500; text-align: left; transition: background .15s, color .15s; position: relative; }
.nv:hover { background: var(--sf2); color: var(--tx); }
.nv.on { background: var(--acs); color: var(--ac); font-weight: 600; }
.nv .n { margin-left: auto; background: var(--ac); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
.side-pie { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.cl-est { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--tx2); padding: 8px 10px; border-radius: 10px; background: var(--sf2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tx3); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--oks); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warns); animation: pulso 1.6s infinite; }
.dot.err { background: var(--err); box-shadow: 0 0 0 3px var(--errs); }

/* selector de cuenta */
.cta { position: relative; }
.cta-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--bd); background: var(--sf2); cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
.cta-btn:hover { border-color: var(--bd2); }
.av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: linear-gradient(135deg, var(--ac2), var(--ac)); overflow: hidden; position: relative; }
.av img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.av.sm { width: 24px; height: 24px; font-size: 10px; }
.av.lg { width: 56px; height: 56px; font-size: 20px; }
.cta-t { min-width: 0; flex: 1; }
.cta-t b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cta-t small { color: var(--tx3); font-size: 11.5px; }
.cta-menu { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; box-shadow: var(--sh2); padding: 6px; z-index: 40; display: none; animation: entrar .15s ease; max-height: 60vh; overflow: auto; }
.cta-menu.on { display: block; }
.cta-it { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; border: 0; background: none; cursor: pointer; text-align: left; }
.cta-it:hover { background: var(--sf2); }
.cta-it.on { background: var(--acs); }
.cta-sep { height: 1px; background: var(--bd); margin: 6px 4px; }
.cta-cab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--tx3); padding: 6px 8px 4px; font-weight: 600; }

.main { min-width: 0; display: flex; flex-direction: column; }
.barra { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
.barra h1 { margin: 0; font-size: 21px; letter-spacing: -.025em; }
.barra .sub { color: var(--tx3); font-size: 13px; }
.barra .der { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.barra .ham { display: none; }
.contenido { padding: 6px 28px 120px; max-width: 1280px; width: 100%; animation: entrar .25s ease; }

/* aviso de Claude */
.aviso-cl { display: flex; gap: 14px; align-items: flex-start; margin: 4px 28px 14px; padding: 14px 16px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--bd)); background: var(--warns); animation: entrar .3s ease; }
.aviso-cl .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--sf); color: var(--warn); flex: none; }
.aviso-cl > div > b { display: block; margin-bottom: 2px; }
.aviso-cl p { margin: 0; color: var(--tx2); font-size: 13px; }
.aviso-cl .acc { margin-left: auto; display: flex; gap: 8px; flex: none; }

/* ---------- componentes ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--bd); background: var(--sf); color: var(--tx); cursor: pointer; font-weight: 600; font-size: 13.5px; text-decoration: none; transition: background .15s, border-color .15s, transform .1s, box-shadow .15s; white-space: nowrap; }
.btn:hover { border-color: var(--bd2); background: var(--sf2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.prim { background: linear-gradient(135deg, var(--ac2), var(--ac)); color: #fff; border-color: transparent; box-shadow: 0 4px 14px color-mix(in srgb, var(--ac) 30%, transparent); }
.btn.prim:hover { filter: brightness(1.05); }
.btn.suave { background: var(--acs); color: var(--ac); border-color: transparent; }
.btn.peligro { color: var(--err); }
.btn.peligro.lleno { background: var(--err); color: #fff; border-color: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.ib { padding: 8px; }
.btn.fant { border-color: transparent; background: transparent; }
.btn.fant:hover { background: var(--sf2); }
.card { background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r); box-shadow: var(--sh); }
.card.pad { padding: 18px; }
.sec { margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
.sec h2 { margin: 0; font-size: 15.5px; letter-spacing: -.01em; }
.sec .der { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--tx2); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--sf2); color: var(--tx2); white-space: nowrap; }
.chip .i { width: 13px; height: 13px; vertical-align: -2px; }
.chip.ac { background: var(--acs); color: var(--ac); }
.chip.ok { background: var(--oks); color: var(--ok); }
.chip.warn { background: var(--warns); color: var(--warn); }
.chip.err { background: var(--errs); color: var(--err); }
.chip.info { background: var(--infos); color: var(--info); }
.chip.anim .i { animation: girar 1.2s linear infinite; }
.grid-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.kpi { padding: 16px 18px; }
.kpi small { color: var(--tx2); font-weight: 500; display: flex; align-items: center; gap: 7px; }
.kpi small .i { color: var(--ac); }
.kpi .n { font-size: 28px; font-weight: 800; letter-spacing: -.03em; margin-top: 6px; }
.kpi .d { color: var(--tx3); font-size: 12px; }
.vacio { text-align: center; padding: 44px 20px; color: var(--tx2); }
.vacio .ic { width: 54px; height: 54px; border-radius: 16px; margin: 0 auto 12px; display: grid; place-items: center; background: var(--acs); color: var(--ac); }
.vacio .ic .i { width: 26px; height: 26px; }
.vacio b { display: block; color: var(--tx); font-size: 15px; margin-bottom: 4px; }
.vacio p { margin: 0 auto 14px; max-width: 420px; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--sf2); border: 1px solid var(--bd); gap: 2px; flex-wrap: wrap; max-width: 100%; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--tx2); display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--sf); color: var(--tx); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.seg .c { font-size: 11px; color: var(--tx3); }
.campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.campo > span { font-weight: 600; font-size: 13px; }
.campo small { color: var(--tx3); }
.in, textarea.in { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--bd); background: var(--sf); outline: none; transition: border-color .15s, box-shadow .15s; }
.in:focus { border-color: var(--ac); box-shadow: 0 0 0 4px var(--acs); }
textarea.in { resize: vertical; min-height: 110px; line-height: 1.5; }
.fila { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lista { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--bd); }
.li:first-child { border-top: 0; }
.li .t { min-width: 0; flex: 1; }
.li .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .t small { color: var(--tx3); }
.mini { width: 44px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--sf3); flex: none; display: grid; place-items: center; color: var(--tx3); overflow: hidden; }
.mini img { width: 100%; height: 100%; object-fit: cover; }

/* toasts */
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--tx); color: var(--bg); padding: 11px 16px; border-radius: 12px; display: flex; gap: 9px; align-items: center; font-weight: 500; box-shadow: var(--sh2); transition: opacity .2s, transform .2s; z-index: 200; max-width: min(560px, 92vw); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast .i { color: var(--ac2); }
.toast.mal .i { color: #ff8a95; }

/* diálogos */
.dlg-fondo { position: fixed; inset: 0; background: rgba(30, 8, 20, .42); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 150; animation: entrar .15s ease; padding: 16px; }
.dlg-fondo.sale { opacity: 0; transition: opacity .14s; }
.dlg { background: var(--sf); border: 1px solid var(--bd); border-radius: 18px; box-shadow: var(--sh2); width: min(460px, 100%); padding: 22px; max-height: 90vh; overflow: auto; }
.dlg.ancho { width: min(620px, 100%); }
.dlg-cab { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.dlg-cab h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.dlg-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--acs); color: var(--ac); flex: none; }
.dlg.peligro .dlg-ic { background: var(--errs); color: var(--err); }
.dlg-tx { color: var(--tx2); margin-bottom: 14px; }
.dlg-tx ol { padding-left: 20px; margin: 8px 0; }
.dlg-tx li { margin-bottom: 6px; }
.dlg-pie { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dlg-in { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--bd); background: var(--sf); outline: none; }
.dlg-in:focus { border-color: var(--ac); box-shadow: 0 0 0 4px var(--acs); }

/* ---------- bandeja ---------- */
.drop { border: 2px dashed var(--bd2); border-radius: var(--r); padding: 22px; display: flex; align-items: center; gap: 16px; background: var(--sf); transition: border-color .15s, background .15s; }
.drop.sobre { border-color: var(--ac); background: var(--acs); }
.fu-grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 10px; }
.card.fu { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.fu.fu-pre { border-color: var(--ac); box-shadow: 0 0 0 3px var(--acs); }
.fu-muestra { min-height: 110px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px; border-radius: 12px; line-height: 1.15; overflow-wrap: anywhere; color: #fff; background: linear-gradient(135deg, #3a2430, #1c1218); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.fu-pie { display: flex; align-items: center; gap: 10px; }
.fu-muestra.chica { min-height: 84px; }
.fu-pie small { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#fuTam { accent-color: var(--ac); }
.fu-ctrl { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.fu-elegir { display: flex; gap: 6px; flex-wrap: wrap; }
.fu-chip { border: 1px solid var(--bd2); background: var(--sf); color: var(--tx); border-radius: 10px; padding: 6px 10px; font-size: 15px; cursor: pointer; }
.fu-chip.on { border-color: var(--ac); background: var(--acs); color: var(--ac); }
@media (max-width: 640px) { .fu-ctrl .campo { width: 100% !important; } }
.drop .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--acs); color: var(--ac); flex: none; }
.drop .tt { display: block; font-size: 15px; font-weight: 700; }
.drop .acc { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.piezas { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.pz { position: relative; border-radius: var(--r); overflow: hidden; background: var(--sf); border: 1px solid var(--bd); box-shadow: var(--sh); cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; animation: entrar .25s ease both; text-align: left; padding: 0; }
.pz:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(120, 30, 70, .13); }
.pz.sel { border-color: var(--ac); box-shadow: 0 0 0 3px var(--acs); }
.pz-img { aspect-ratio: 4 / 5; background: var(--sf3); position: relative; display: grid; place-items: center; color: var(--tx3); }
.pz-img img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
.pz-tipo { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
.pz-tipo .chip { background: rgba(20, 8, 14, .62); color: #fff; backdrop-filter: blur(6px); }
.pz-cuenta { position: absolute; right: 10px; top: 10px; }
.pz-check { position: absolute; right: 10px; bottom: 10px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: rgba(20, 8, 14, .35); display: grid; place-items: center; color: #fff; }
.pz.sel .pz-check { background: var(--ac); border-color: var(--ac); }
.pz-num { position: absolute; left: 10px; bottom: 10px; }
.pz-num .chip { background: rgba(20, 8, 14, .62); color: #fff; }
.pz-pie { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.pz-pie .fila { gap: 6px; }
.pz-img video { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; background: #000; }
.pz-img .rp { position: absolute; inset: 0; }
.pz-img .rp video { object-fit: cover; }
.mt { cursor: default; }
.mt:hover { transform: none; }
.mt-link { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 14px; }
.mt-link .in { flex: 1; min-width: 220px; }
.li audio { height: 36px; max-width: 280px; }
.mt-et { display: flex; gap: 4px; flex-wrap: wrap; }
.mt-et .chip { cursor: pointer; }
.cp-grid { display: grid; grid-template-columns: 250px minmax(340px, 1fr) 330px; gap: 14px; margin-top: 14px; align-items: start; }
@media (max-width: 1180px) { .cp-grid { grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); } }
.cp-hero { padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.cp-hero-t { display: flex; gap: 12px; align-items: flex-start; }
.cp-hero-t b { display: block; font-size: 15.5px; }
.cp-hero-t small { color: var(--tx2); font-size: 12.5px; }
.cp-hero-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--ac2), var(--ac)); color: #fff; flex: none; }
.cp-hero-in { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.cp-hero-in textarea { flex: 1; min-width: 260px; min-height: 64px; resize: vertical; font-size: 13px; }
.cp-hero-bt { display: flex; flex-direction: column; gap: 8px; }
.cp-hero-bt .btn { justify-content: center; }
.cp-banco { border-top: 1px solid var(--bd); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.cp-banco b .i { vertical-align: -2px; }
.in-voto { display: flex; gap: 4px; }
.in-voto button, .in-motivos button { border: 1px solid var(--bd); background: var(--sf2); border-radius: 99px; cursor: pointer; color: var(--tx2); }
.in-voto button { flex: 1; padding: 3px 0; font-size: 14px; }
.in-voto button.on { border-color: var(--ac); background: var(--acs); }
.in-motivos { display: flex; flex-wrap: wrap; gap: 3px; }
.in-motivos button { font-size: 10.5px; padding: 2px 7px; }
.in-motivos button.on { border-color: var(--err, #d33); color: var(--tx); }
.cp-links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow: auto; }
.cp-links li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 6px; border-radius: 8px; background: var(--sf2); }
.cp-links li a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tx); }
.cp-links li.usado a { color: var(--tx3); }
.cp-lote { padding: 12px 16px; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }

.cp-h.sel { border-color: var(--ac); box-shadow: 0 0 0 2px var(--acs); }

.cp-tirador { position: absolute; right: -10px; bottom: -10px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2.5px solid var(--ac); cursor: nwse-resize; box-shadow: 0 1px 4px rgba(0, 0, 0, .4); opacity: .0; transition: opacity .15s; }

.cp-campo { display: flex; flex-direction: column; gap: 6px; }

/* lateral (detalle de pieza) */

.medidor { height: 6px; border-radius: 99px; background: var(--sf3); overflow: hidden; margin-top: 8px; }

/* selector de hora */
.pk { display: flex; flex-direction: column; gap: 10px; }

.pk-d { border: 1px solid var(--bd); background: var(--sf); border-radius: 12px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; min-width: 54px; cursor: pointer; }

/* calendario */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.cal-d { background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r2); min-height: 260px; display: flex; flex-direction: column; }
.cal-d.hoy { border-color: var(--ac); box-shadow: 0 0 0 3px var(--acs); }
.cal-c { padding: 10px 12px; border-bottom: 1px solid var(--bd); display: flex; align-items: baseline; gap: 6px; }

.cal-c b { font-size: 18px; }
.cal-it { margin: 8px 8px 0; padding: 8px; border-radius: 10px; background: var(--sf2); border-left: 3px solid var(--ac); font-size: 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; transition: background .15s; }
.cal-it:hover { background: var(--sf3); }
.cal-it.pub { border-left-color: var(--ok); }
.cal-it.venc { border-left-color: var(--warn); }
.cal-it.err { border-left-color: var(--err); }
.cal-it img { width: 30px; height: 38px; border-radius: 6px; object-fit: cover; flex: none; background: var(--sf3); }
.cal-it .t { min-width: 0; }
.cal-it b { display: block; }
.cal-it small { color: var(--tx3); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* tendencias */
.tend { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.td { padding: 18px; display: flex; flex-direction: column; gap: 10px; animation: entrar .3s ease both; }
.td .num { width: 30px; height: 30px; border-radius: 9px; background: var(--acs); color: var(--ac); display: grid; place-items: center; font-weight: 800; }
.td h3 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
.td p { margin: 0; color: var(--tx2); font-size: 13px; }
.td .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.td .pie { margin-top: auto; display: flex; gap: 8px; }

/* estadísticas */
.graf { width: 100%; height: 190px; display: block; }
.graf text { fill: var(--tx3); font-size: 10.5px; font-family: inherit; }
.barras-h { display: flex; align-items: flex-end; gap: 3px; height: 130px; padding-top: 8px; }
.barras-h div { flex: 1; background: var(--sf3); border-radius: 4px 4px 0 0; position: relative; min-height: 3px; transition: height .5s ease; }
.barras-h div.top { background: linear-gradient(180deg, var(--ac2), var(--ac)); }
.ejes-h { display: flex; gap: 3px; font-size: 10px; color: var(--tx3); margin-top: 4px; }
.ejes-h span { flex: 1; text-align: center; }
.dos { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
.dos > * { min-width: 0; }   /* un link largo no ensancha la página en el celular */
table.tabla { width: 100%; border-collapse: collapse; }
.tabla th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--tx3); padding: 10px 14px; font-weight: 600; }
.tabla td { padding: 10px 14px; border-top: 1px solid var(--bd); vertical-align: middle; }
.tabla td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.tabla th.n { text-align: right; }

/* comentarios */
.cm { padding: 14px 16px; border-top: 1px solid var(--bd); display: grid; grid-template-columns: 40px 1fr; gap: 12px; animation: entrar .2s ease both; }
.cm:first-child { border-top: 0; }
.cm .cab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cm .cab b { font-size: 13.5px; }
.cm .cab small { color: var(--tx3); }
.cm .txt { margin: 4px 0 8px; }
.cm .resp { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.cm .resp .in { flex: 1; min-width: 200px; min-height: 0; padding: 8px 10px; }
.cm .post { font-size: 12px; color: var(--tx3); }

/* cuentas */
.fb { padding: 16px; display: flex; flex-direction: column; gap: 14px; margin: 6px 0 18px; }
.fb-cab { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.fb-cab b { display: block; font-size: 15.5px; }
.fb-form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.fb-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--tx2); }
.fb-form .in { width: 120px; }
.fb-feed { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow: auto; border-top: 1px solid var(--bd); padding-top: 10px; }
.fb-it { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.fb-it img { width: 34px; height: 48px; object-fit: cover; border-radius: 6px; flex: none; }
.fb-it b { display: block; font-weight: 600; }
.fb-it small { color: var(--tx3); }

async function api(ruta, cuerpo) {

  if (!r.ok) throw new Error(d.error || d.detail || "Algo falló");

}

// selector de hora (del proyecto base, adaptado)
function pickerHora(cuando, sugerido) {
  const [fd, fh] = (cuando || "").split("T"), hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const dias = [...Array(14)].map((_, k) => { const d = new Date(hoy); d.setDate(d.getDate() + k); return d; });
  const horas = ["09:00", "12:00", "14:00", "17:00", "19:00", "20:00", "21:00", "22:00"];
  const sh = sugerido ? sugerido.split("T")[1] : "";
  [fh, sh].forEach(x => { if (x && !horas.includes(x.slice(0, 5))) horas.push(x.slice(0, 5)); }); horas.sort();
  const etq = d => { const k = Math.round((d - hoy) / 864e5); return k === 0 ? "Hoy" : k === 1 ? "Mañana" : DSEM[d.getDay()]; };
  return `<div class="pk"><input type="hidden" id="pk-cuando" value="${esc(cuando)}">
    <div class="pk-dias">${dias.map(d => `<button type="button" class="pk-d ${ymd(d) === fd ? "on" : ""}" data-pday="${ymd(d)}"><small>${etq(d)}</small><b>${d.getDate()}</b><em>${MESC[d.getMonth()]}</em></button>`).join("")}</div>
    <div class="pk-horas">${horas.map(hh => `<button type="button" class="pk-h ${fh && fh.slice(0, 5) === hh ? "on" : ""} ${sh === hh ? "sug" : ""}" data-phora="${hh}">${hh}</button>`).join("")}
      <label class="pk-otra">otra <input type="time" id="pk-otra" value="${esc((fh || "").slice(0, 5))}"></label></div>
    <div class="pk-res" id="pk-res">${resumenHora(cuando)}</div></div>`;
}
function resumenHora(c) {
  if (!c) return ""; const d = new Date(c), hoy = new Date(); hoy.setHours(0, 0, 0, 0); if (isNaN(d)) return "";
  const k = Math.round((new Date(d).setHours(0, 0, 0, 0) - hoy) / 864e5);
  const pasado = d < new Date();
  return `Sale <b>${k === 0 ? "hoy" : k === 1 ? "mañana" : DSEM_L[d.getDay()]} ${d.getDate()} de ${MESC[d.getMonth()]}</b> a las <b>${hhmm(d)}</b>${pasado ? ' <span style="color:var(--err)">· esa hora ya pasó</span>' : ""}`;
}
function setPicker(dia, hora) {
  const inp = $("#pk-cuando"); if (!inp) return;
  const [fd, fh] = inp.value.split("T"); const v = `${dia || fd}T${hora || (fh || "12:00").slice(0, 5)}`;
  inp.value = v;
  $$(".pk-d").forEach(b => b.classList.toggle("on", b.dataset.pday === v.split("T")[0]));
  $$(".pk-h").forEach(b => b.classList.toggle("on", b.dataset.phora === v.split("T")[1]));
  if ($("#pk-otra")) $("#pk-otra").value = v.split("T")[1];
  $("#pk-res").innerHTML = resumenHora(v);
}

}

// ----- Calendario -----
function lunes(off) { const d = new Date(); d.setHours(0, 0, 0, 0); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w + off * 7); return d; }
function pCalendario() {
  if (!S.cuentas.length) return sinCuentas();
  const c = activa(), clave = calTodas ? "todas" : c.id;
  if (clave !== calClave || Date.now() - calTs > 60000) { calClave = clave; calTs = Date.now(); api("/api/calendario?cuenta=" + encodeURIComponent(clave)).then(d => { CAL = d; if (pagina === "calendario") render(); }).catch(() => {}); }
  const ini = lunes(semana), dias = [...Array(7)].map((_, k) => { const d = new Date(ini); d.setDate(d.getDate() + k); return d; });
  const fin = new Date(ini); fin.setDate(fin.getDate() + 7);
  const ps = S.piezas.filter(p => (calTodas || p.cuenta === c.id) && p.cuando && ["programada", "planificada", "subiendo", "publicada", "vencida", "error"].includes(p.estado));
  const ids = new Set(ps.map(p => p.media_id).filter(Boolean));
  const items = [
    ...ps.map(p => ({ cuando: p.estado === "publicada" ? (p.publicado || p.cuando) : p.cuando, cuenta: p.cuenta, tipo: p.tipo, est: p.estado, img: p.vistas_previas[0], pieza: p.id, txt: p.caption })),
    ...(CAL.medios || []).filter(m => m.publicado && !ids.has(m.id) && (calTodas || m.cuenta === c.id)).map(m => ({ cuando: m.publicado, cuenta: m.cuenta, tipo: /REEL/i.test(m.tipo) ? "reel" : /CAROUSEL/i.test(m.tipo) ? "carrusel" : /STOR/i.test(m.tipo) ? "historia" : "foto", est: "publicada", img: m.miniatura, url: m.url, txt: m.caption, vistas: m.vistas })),
  ].filter(x => { const d = new Date(x.cuando); return d >= ini && d < fin; }).sort((a, b) => a.cuando.localeCompare(b.cuando));

// ----- Estadísticas -----
function pEstadisticas() {
  const c = activa(); if (!c) return sinCuentas();
  if (stClave !== c.id || Date.now() - stTs > 60000) { stClave = c.id; stTs = Date.now(); api("/api/stats?cuenta=" + encodeURIComponent(c.id)).then(d => { ST = d; if (pagina === "estadisticas") render(); }).catch(() => {}); }
  if (!c.conectada && !(ST && ST.medios && ST.medios.length)) return `<div class="card"><div class="vacio"><div class="ic">${icn("bar-chart")}</div><b>@${esc(c.usuario)} no está conectada</b><p>Conectala para ver seguidores, alcance y los mejores horarios.</p><button class="btn prim" data-conectar>Conectar</button></div></div>`;
  if (!ST) return `<div class="card"><div class="vacio"><div class="ic">${icn("loader")}</div><b>Cargando…</b></div></div>`;
  const e = ST.estado || {}, k = e.cuenta_28d || {}, h = ST.historial || [], ms = ST.medios || [], hor = ST.horarios || {};
  const segs = h.filter(x => x.seguidores != null);
  const dif = segs.length > 1 ? segs[segs.length - 1].seguidores - segs[0].seguidores : null;
  const top = [...ms].filter(m => m.vistas != null).sort((a, b) => b.vistas - a.vistas).slice(0, 12);
  const ph = hor.por_hora || [], maxH = Math.max(1, ...ph.map(x => x.promedio));
  const porH = [...Array(24)].map((_, i) => ph.find(x => +x.hora.slice(0, 2) === i));
  const mejoresH = new Set([...ph].sort((a, b) => b.promedio - a.promedio).slice(0, 3).map(x => x.hora));
  return `<div class="grid-kpi" style="margin-top:6px">
    <div class="card kpi"><small>${icn("users2")}Seguidores</small><div class="n">${miles(e.seguidores)}</div><div class="d">${dif != null ? (dif >= 0 ? "+" : "") + miles(dif) + " desde que se mide" : "—"}</div></div>
    <div class="card kpi"><small>${icn("eye")}Vistas (28 días)</small><div class="n">${corto(k.views)}</div><div class="d">de todas las publicaciones</div></div>
    <div class="card kpi"><small>${icn("target")}Alcance (28 días)</small><div class="n">${corto(k.reach)}</div><div class="d">cuentas distintas</div></div>
    <div class="card kpi"><small>${icn("heart")}Interacciones (28 días)</small><div class="n">${corto(k.total_interactions)}</div><div class="d">${corto(k.accounts_engaged)} cuentas interactuaron</div></div></div>
  <div class="dos" style="margin-top:14px">
    <div class="card pad"><b>Seguidores</b>${grafLinea(segs.map(x => [x.fecha, x.seguidores]))}</div>
    <div class="card pad"><b>Mejores horarios</b><div class="muted" style="font-size:12.5px">Vistas promedio según la hora en que se publicó${hor.con_datos ? ` (${hor.con_datos} publicaciones)` : ""}.</div>
      ${ph.length ? `<div class="barras-h">${porH.map((x, i) => `<div class="${x && mejoresH.has(x.hora) ? "top" : ""}" style="height:${x ? Math.max(3, x.promedio / maxH * 100) : 2}%" title="${String(i).padStart(2, "0")}:00 · ${x ? miles(x.promedio) + " vistas promedio (" + x.n + ")" : "sin publicaciones"}"></div>`).join("")}</div><div class="ejes-h">${[...Array(24)].map((_, i) => `<span>${i % 3 === 0 ? i : ""}</span>`).join("")}</div>
      <div class="fila" style="margin-top:12px">${(hor.mejores || []).slice(0, 3).map(m => `<span class="chip ac">${icn("clock")}${esc(m.dia)} ${esc(m.hora)} · ${corto(m.promedio)}</span>`).join("")}</div>` : `<div class="vacio" style="padding:20px"><p>Hacen falta publicaciones con estadísticas para calcularlo.</p></div>`}</div></div>
  <div class="sec"><h2>Publicaciones y links</h2><div class="der"><button class="btn sm" data-sync="${esc(c.id)}">${icn("refresh")}Actualizar</button><span class="chip">${icn("clock")}${esc(haceISO(e.ultima))}</span></div></div>
  <div class="card" style="overflow:auto">${top.length || ms.length ? `<table class="tabla"><thead><tr><th>Publicación</th><th>Fecha</th><th class="n">Vistas</th><th class="n">Alcance</th><th class="n">Me gusta</th><th class="n">Coment.</th><th></th></tr></thead><tbody>
    ${(top.length ? top : ms.slice(0, 12)).map(m => `<tr><td><div class="fila" style="flex-wrap:nowrap"><div class="mini" style="width:36px;height:44px">${m.miniatura ? `<img src="${esc(m.miniatura)}" alt="" loading="lazy" onerror="this.remove()">` : icn("image")}</div><span style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block">${esc((m.caption || "").split("\n")[0] || "(sin texto)")}</span></div></td><td class="muted" style="white-space:nowrap">${esc(cuandoCorto(m.publicado))}</td><td class="n">${corto(m.vistas)}</td><td class="n">${corto(m.alcance)}</td><td class="n">${corto(m.likes)}</td><td class="n">${corto(m.comentarios)}</td><td style="white-space:nowrap">${m.url ? `<button class="btn sm fant" data-copiar="${esc(m.url)}" title="Copiar link">${icn("link")}</button><a class="btn sm fant" href="${esc(m.url)}" target="_blank" rel="noopener" title="Abrir">${icn("external")}</a>` : ""}</td></tr>`).join("")}</tbody></table>` : `<div class="vacio"><p>Todavía no hay publicaciones leídas.</p></div>`}</div>`;
}
function grafLinea(pts) {
  if (pts.length < 2) return `<div class="vacio" style="padding:30px"><p>El gráfico aparece cuando haya al menos dos mediciones (una por hora con el panel abierto).</p></div>`;
  const W = 600, H = 190, P = 28, ys = pts.map(p => p[1]), mn = Math.min(...ys), mx = Math.max(...ys), r = mx - mn || 1;
  const x = i => P + i * (W - P * 2) / (pts.length - 1), y = v => H - P - (v - mn) / r * (H - P * 2);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const ac = getComputedStyle(document.documentElement).getPropertyValue("--ac").trim();
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Seguidores en el tiempo"><defs><linearGradient id="gseg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${ac}" stop-opacity=".28"/><stop offset="1" stop-color="${ac}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L${x(pts.length - 1)},${H - P}L${x(0)},${H - P}Z" fill="url(#gseg)"/><path d="${d}" fill="none" stroke="${ac}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <text x="${P}" y="${H - 8}">${esc(cuandoCorto(pts[0][0]))}</text><text x="${W - P}" y="${H - 8}" text-anchor="end">${esc(cuandoCorto(pts[pts.length - 1][0]))}</text><text x="${P}" y="14">${miles(mx)}</text></svg>`;
}

    <div class="cab"><b>@${esc(x.usuario)}</b><small>${esc(cuandoCorto(x.fecha))}</small>${claseChip(x)}${x.alerta ? `<span class="chip warn">${icn("alert")}${esc(x.alerta)}</span>` : ""}</div>
    <div class="txt">${esc(x.texto)}</div>
    ${x.estado === "nuevo" ? `<div class="resp"><textarea class="in" rows="1" data-resp="${esc(x.id)}" placeholder="Escribí una respuesta o tocá Sugerir respuestas">${esc(x.sugerencia || "")}</textarea><button class="btn sm prim" data-enviar="${esc(x.id)}">${icn("send")}Enviar</button><button class="btn sm" data-ocultar="${esc(x.id)}" title="Ocultar el comentario en Instagram">${icn("eye-off")}Ocultar</button><button class="btn sm fant" data-saltar="${esc(x.id)}">${icn("skip")}Saltar</button></div>`
      : x.respuesta_enviada ? `<div class="muted" style="font-size:13px">${icn("check", "sm")} Respondiste: ${esc(x.respuesta_enviada)}</div>` : `<div class="muted" style="font-size:13px">${x.estado === "oculto" ? "Oculto en Instagram" : x.estado === "saltado" ? "Salteado" : "Respondido"}</div>`}
    <div class="post">${x.post ? `En <a href="${esc(x.post)}" target="_blank" rel="noopener">${esc((x.post_texto || "la publicación").slice(0, 60))}</a>` : ""}</div></div></div>`).join("")

  <p class="muted" style="font-size:12.5px">${icn("shield", "sm")} Nada se manda sin que toques Enviar. Los comentarios zarpados o de spam conviene ocultarlos (no se borran, solo dejan de verse).</p>`;

// ----- Cuentas -----

  const traer = otras.length ? `<div class="card pad" style="margin-top:16px"><b>${icn("layers")} Cuentas de ${esc((S.espacios || {})[espacio === "noticias" ? "modelos" : "noticias"] || "")}</b><p class="muted" style="margin:6px 0 10px;font-size:12.5px">Si alguna es de este espacio, traela (con sus multicuentas).</p><div class="fila">${otras.map(c => `<button class="btn sm" data-traeresp="${esc(c.id)}">${avatar(c, "sm")}@${esc(c.usuario)} ${icn("chevrons", "sm")}</button>`).join("")}</div></div>` : "";
  if (espacio === "noticias") return `<div class="sec" style="margin-top:6px"><h2>${S.cuentas.length} ${S.cuentas.length === 1 ? "cuenta" : "cuentas"} de noticias</h2><div class="der"><button class="btn" data-crearlocal>${icn("plus")}Agregar cuenta</button><button class="btn prim" data-conectar>${icn("link")}Conectar cuenta</button></div></div>
    ${S.cuentas.length ? `<div class="nt-grid">${S.cuentas.map(c => `<div class="card cu"><div class="cu-cab">${avatar(c, "lg")}<div style="min-width:0;flex:1"><b>@${esc(c.usuario)}</b><small class="muted">${c.nombre ? esc(c.nombre) : "Cuenta de noticias"}</small></div>${c.conectada ? `<span class="chip ok">${icn("check")}Conectada</span>` : `<span class="chip">${icn("alert")}Sin conectar</span>`}</div>

      ${c.error ? `<div class="chip err" style="white-space:normal">${esc(c.error)}</div>` : ""}
      <div class="fila"><button class="btn sm" data-editarcuenta="${esc(c.id)}">${icn("pencil")}Editar</button>${c.conectada ? `<button class="btn sm" data-sync="${esc(c.id)}">${icn("refresh")}Sincronizar</button>` : `<button class="btn sm prim" data-conectar>${icn("link")}Conectar</button>`}${c.conectada ? `<button class="btn sm fant peligro" data-desconectar="${esc(c.id)}">${icn("log-out")}Desconectar</button>` : ""}</div></div>`).join("")}</div>`

  return pCuentasModelos() + traer;

function pCuentasModelos() {
  // cada main es una modelo (con su Material); sus multicuentas cuelgan de ella y usan ese mismo Material
  const mains = S.cuentas.filter(c => !c.main), hijas = m => S.cuentas.filter(c => c.main === m.id);

      ${c.conectada ? `<span class="chip ok">${icn("check")}Conectada</span>` : `<span class="chip">${icn("alert")}Sin conectar</span>`}</div>
    ${chica ? "" : `<div class="cu-datos"><div><small>Seguidores</small><b>${corto(c.seguidores)}</b></div><div><small>Publicaciones</small><b>${corto(c.publicaciones)}</b></div><div><small>Multicuentas</small><b>${hijas(c).length}</b></div></div>`}

  return `<div class="sec" style="margin-top:6px"><h2>${mains.length} ${mains.length === 1 ? "modelo" : "modelos"} · ${S.cuentas.length} ${S.cuentas.length === 1 ? "cuenta" : "cuentas"}</h2><div class="der"><button class="btn" data-crearlocal>${icn("plus")}Agregar main (modelo)</button><button class="btn prim" data-conectar>${icn("link")}Conectar cuenta</button></div></div>

function pintarChat() {
  const m = S.chat || []; const id = m.length ? m[m.length - 1].id : 0;

  if (!chatAbierto && ultimoChat !== -1 && nuevos) { $("#badge").textContent = nuevos; $("#badge").classList.add("on"); }
  ultimoChat = id;
  const esperando = m.length && ["vos"].includes(m[m.length - 1].de) && S.claude.puente !== "apagado";
  $("#msjs").innerHTML = (m.length ? "" : `<div class="m panel">Escribile a Claude lo que necesites: ideas, textos, dudas sobre tus cuentas.</div>`) + m.map(x => `<div class="m ${x.de}">${x.de === "pedido" ? icn("send", "sm") + " Pedido enviado: " + esc(x.tipo_pedido || "") : esc(x.texto)}${["vos", "claude"].includes(x.de) ? `<small>${x.de === "vos" ? "Vos" : "Claude"} · ${esc(x.hora)}</small>` : ""}</div>`).join("") + `<div class="tipeo ${esperando ? "on" : ""}"><i></i><i></i><i></i></div>`;

}

  if (d.mtmas !== undefined) { mtMas = !mtMas; if (!mtMas && mtFiltro && !["-", "ojo"].includes(mtFiltro)) mtFiltro = ""; return render(); }
  if (d.mtfiltro !== undefined) { mtFiltro = mtFiltro === d.mtfiltro ? "" : d.mtfiltro; return render(); }
  if (d.mtetiquetar) return etiquetarMt(d.mtetiquetar);
  if (d.mtdescartar) { try { await api("/api/material", { op: "descartar", cuenta: activa().id, id: d.mtdescartar }); cargarMaterial(true); } catch (er) { fallo(er); } return; }
  if (d.mtbandeja) { try { await api("/api/material", { op: "a_bandeja", cuenta: activa().id, sec: mtSec, nombre: d.mtbandeja }); toast("Copiada a la Bandeja"); refrescar(true); } catch (er) { fallo(er); } return; }
  if (d.mtborrar) { if (!(await confirmar({ titulo: "¿Borrar este archivo?", peligro: true, texto: "Se borra del material de la cuenta.", ok: "Borrar" }))) return; try { await api("/api/material", { op: "borrar", cuenta: activa().id, sec: mtSec, nombre: d.mtborrar }); toast("Borrado"); cargarMaterial(true); } catch (er) { fallo(er); } return; }
  if (t.id === "modoElegir" || t.id === "cancelSel") { eligiendo = t.id === "modoElegir" ? !eligiendo : false; sel = []; return render(); }
  if (t.id === "juntar") { try { const p = await api("/api/pieza", { op: "juntar", ids: sel }); eligiendo = false; sel = []; await refrescar(true); toast("Carrusel armado"); abrirPieza(p.id); } catch (er) { fallo(er); } return; }
  if (d.tipo) { try { await api("/api/pieza", { op: "tipo", id: abierta, tipo: d.tipo }); await refrescar(true); pintarLateral(true); } catch (er) { fallo(er); } return; }
  if (d.mover) { const [i, k] = d.mover.split(":").map(Number); const p = S.piezas.find(x => x.id === abierta); if (p && i + k >= 0 && i + k < p.archivos.length) moverA(i, i + k); return; }
  if (d.separar) { try { await api("/api/pieza", { op: "separar", id: abierta, archivo: d.separar }); prevIdx = 0; await refrescar(true); pintarLateral(true); toast("Volvió a la bandeja como pieza aparte"); } catch (er) { fallo(er); } return; }
  if (d.tag) { const ta = $("#caption"); if (ta && !ta.value.includes(d.tag)) { ta.value = (ta.value.trimEnd() + " " + d.tag).trim(); contar(); } return; }
  if (d.pday) return setPicker(d.pday, null);
  if (d.phora) return setPicker(null, d.phora);
  if (d.jueces) {
    try { await api("/api/pieza", { op: "jueces", id: d.jueces }); toast(S.claude.puente === "apagado" ? "Pedido guardado: Claude lo ve cuando lo conectes" : "Pedido enviado a los jueces"); await refrescar(true); if (abierta) pintarLateral(true); } catch (er) { fallo(er); } return;
  }
  if (d.programar || d.ya) {
    const id = d.programar || d.ya, p = S.piezas.find(x => x.id === id); if (!p) return;
    const cap = $("#caption") && abierta === id ? $("#caption").value : p.caption;
    const cuando = d.ya ? null : ($("#pk-cuando") ? $("#pk-cuando").value : p.cuando);
    if (d.ya && !(await confirmar({ titulo: "¿Publicar ahora?", icono: "send", texto: `Se publica ya en @${(cuenta(p.cuenta) || {}).usuario || p.cuenta}. ${p.jueces ? "" : "Los jueces todavía no la vieron."}`, ok: "Publicar ahora" }))) return;
    try { await api("/api/pieza", { op: "programar", id, caption: cap, cuando }); toast(d.ya ? "Publicando… te aviso cuando salga" : "Aprobada y programada " + cuandoCorto(cuando)); await refrescar(true); if (abierta) pintarLateral(true); } catch (er) { fallo(er); } return;
  }
  if (d.cancelar) { try { await api("/api/pieza", { op: "cancelar", id: d.cancelar }); toast("Salió de la cola"); await refrescar(true); pintarLateral(true); } catch (er) { fallo(er); } return; }
  if (d.borrar) {
    if (!(await confirmar({ titulo: "¿Quitar de la bandeja?", peligro: true, texto: "Los archivos no se borran: van a la carpeta _descartados de esa cuenta.", ok: "Quitar" }))) return;
    try { await api("/api/pieza", { op: "borrar", id: d.borrar }); cerrarLateral(); toast("Quitada de la bandeja"); refrescar(true); } catch (er) { fallo(er); } return;
  }
  if (d.semana) { semana = d.semana === "0" ? 0 : semana + Number(d.semana); return render(); }
  if (d.caltodas) { calTodas = d.caltodas === "1"; calTs = 0; return render(); }
  if (t.id === "pedirTend") { try { await api("/api/tendencias", { cuenta: activa().id }); toast("Pedido enviado: Claude busca tendencias"); refrescar(true); } catch (er) { fallo(er); } return; }
  if (d.editarcuenta) return editarCuenta(d.editarcuenta);
  if (d.crearlocal !== undefined) return crearLocal();
  if (d.crearmulti) return crearLocal(d.crearmulti);
  if (d.fbdia) { fbDia = d.fbdia; return render(); }
  if (d.fbmandar !== undefined) {
    const dia = fbDia === "hoy" ? ymd(new Date()) : (() => { const x = new Date(); x.setDate(x.getDate() + 1); return ymd(x); })();
    return api("/api/encargo", { dia, reels: fbR, historias: fbH }).then(r => { actTs = 0; toast(`A trabajar: ${r.reels} reels y ${r.historias} historias ya repartidos, el resto en camino`); refrescar(true); }).catch(fallo);
  }
  if (d.mtmodelo) { cambiarCuenta(d.mtmodelo); return mtIr("carpetas", d.mtmodelo); }
  if (d.mtvista) { if (d.mtvista === "modelos") MODS = null; return mtIr(d.mtvista, (activa() || {}).id); }
  if (d.mtpyro) { try { await api("/api/pyro", { op: "material", cuenta: d.mtpyro }); toast("Trayendo el material de Pyro: aparece en unos minutos"); } catch (er) { fallo(er); } return; }
  if (d.mtnuevacarpeta !== undefined) { return dialogo({ tipo: "pedir", titulo: "Nueva carpeta", icono: "folder", ok: "Crear", placeholder: "Ej.: Historias, Reels, Canal free…" }).then(n => { if (!n) return; const ac = activa(); return api("/api/material", { op: "nueva_carpeta", cuenta: ac.id, nombre: n }).then(() => { cargarMaterial(true); toast("Carpeta creada"); }).catch(fallo); }); }
  if (d.repartir !== undefined) {
    const m = new Date(); m.setDate(m.getDate() + 1);
    return api("/api/repartir", { dia: ymd(m) }).then(r => { calTodas = true; refrescar(true); avisar({ titulo: "Cronograma de mañana", icono: "calendar", texto: `Se repartieron ${r.reels} reels entre las multicuentas y ${r.historias} historias en las main.` + (r.faltan.length ? ` Faltó: ${r.faltan.slice(0, 6).join(" · ")}${r.faltan.length > 6 ? "…" : ""}` : "") }); }).catch(fallo);
  }
  if (d.sync) { toast("Sincronizando con Instagram…"); try { const r = await api("/api/cuenta", { op: "sincronizar", id: d.sync }); r.ok ? toast("Listo") : toast(r.error || "No se pudo", true); stTs = 0; calTs = 0; refrescar(true); } catch (er) { fallo(er); } return; }
  if (d.desconectar) { if (!(await confirmar({ titulo: "¿Desconectar esta cuenta?", peligro: true, texto: "Se borra el permiso guardado. Lo programado de esta cuenta no se va a poder publicar hasta que la reconectes.", ok: "Desconectar" }))) return; try { await api("/api/cuenta", { op: "desconectar", id: d.desconectar }); toast("Desconectada"); refrescar(true); } catch (er) { fallo(er); } return; }
  if (t.id === "cmActualizar") { toast("Trayendo comentarios…"); try { const r = await api("/api/comentario", { op: "actualizar", cuenta: activa().id }); toast(`${r.nuevos} comentarios nuevos`); cmTs = 0; render(); } catch (er) { fallo(er); } return; }
  if (t.id === "cmSugerir") { try { const r = await api("/api/comentario", { op: "sugerir", cuenta: activa().id }); toast(r.n ? (r.via === "chat" ? "Pedido enviado a Claude" : "Claude está pensando las respuestas") : "No hay comentarios nuevos sin sugerencia"); cmTs = 0; render(); } catch (er) { fallo(er); } return; }
  if (d.enviar) { const ta = document.querySelector(`[data-resp="${CSS.escape(d.enviar)}"]`); const texto = ta ? ta.value.trim() : ""; if (!texto) return toast("Escribí la respuesta", true); t.disabled = true; try { await api("/api/comentario", { op: "responder", cuenta: activa().id, comentario: d.enviar, texto }); toast("Respuesta enviada"); cmTs = 0; render(); } catch (er) { fallo(er); t.disabled = false; } return; }
  if (d.ocultar) { try { await api("/api/comentario", { op: "ocultar", cuenta: activa().id, comentario: d.ocultar }); toast("Comentario oculto"); cmTs = 0; render(); } catch (er) { fallo(er); } return; }
  if (d.saltar) { try { await api("/api/comentario", { op: "saltar", cuenta: activa().id, comentario: d.saltar }); cmTs = 0; render(); } catch (er) { fallo(er); } return; }
  if (t.id === "ajGuardarClave") {
    const v = ($("#ajClave") || {}).value || "";
    if (!v.trim()) return toast("Pegá la clave primero", true);
    t.disabled = true;
    try { AJ = await api("/api/ajustes", { anthropic_api_key: v }); toast("Clave guardada: Claude conectado"); refrescar(true); render(true); } catch (er) { fallo(er); t.disabled = false; }
    return;
  }
  if (t.id === "ajProbarClaude") {
    const antes = t.innerHTML; t.disabled = true; t.innerHTML = `${icn("loader", "sm")}Probando…`;
    try { const r = await api("/api/probar_claude", {}); toast(`Claude respondió en ${(r.ms / 1000).toFixed(1)} s (${r.modelo}). Todo bien.`); }
    catch (er) { fallo(er); } finally { t.disabled = false; t.innerHTML = antes; }
    return;
  }
  if (t.id === "ajBorrarClave") {
    if (!(await confirmar({ titulo: "¿Quitar la API key de Claude?", peligro: true, texto: "Los jueces, la fábrica y el chat dejan de funcionar hasta que cargues otra.", ok: "Quitar" }))) return;
    try { AJ = await api("/api/ajustes", { borrar_clave_claude: true }); toast("Clave quitada"); refrescar(true); render(true); } catch (er) { fallo(er); }
    return;
  }
  if (d.fusubir !== undefined) return $("#fuArchivos").click();
  if (d.fupre) return fuAccion({ op: "predeterminada", clave: d.fupre }, "Listo: los reels nuevos salen con esta letra");
  if (d.fuagregar) return fuAccion({ op: "agregar", clave: d.fuagregar }, "Agregada a Mis fuentes");
  if (d.fcpag) { fcPag = Math.max(0, fcPag + +d.fcpag); cargarCatalogo(); const c = $("#fuCatTotal"); c && c.closest(".sec").scrollIntoView({ behavior: "smooth" }); return; }
  if (d.fuclaude !== undefined) return fuAccion({ op: "claude", valor: d.fuclaude === "1" });
  if (d.fusacar) return fuAccion({ op: "borrar", clave: d.fusacar }, "La sacaste de Mis fuentes: queda en el catálogo por si la querés de nuevo");
  if (d.fuborrar) { if (!(await confirmar({ titulo: "¿Borrar esta fuente?", peligro: true, texto: "Se borra del servidor. Los reels que ya se armaron con ella no cambian; los que se rehagan van a usar la predeterminada.", ok: "Borrar" }))) return; return fuAccion({ op: "borrar", clave: d.fuborrar }, "Fuente borrada"); }
  if (d.furenombrar) { const f = FU.fuentes.find(x => x.clave === d.furenombrar); const n = await dialogo({ tipo: "pedir", titulo: "Nombre de la fuente", icono: "type", ok: "Guardar", valor: f ? f.nombre : "" }); if (!n) return; return fuAccion({ op: "renombrar", clave: d.furenombrar, nombre: n }, "Nombre cambiado"); }
  if (t.id === "pyGuardar") {
    t.disabled = true;
    try { const r = await api("/api/pyro", { op: "guardar", url: $("#pyUrl").value, clave: $("#pyClave").value }); PY = r; toast(`Pyro conectado: ${r.n_modelos} modelos. Sincronizando…`); render(true); setTimeout(() => { PY = null; if (pagina === "ajustes") render(true); }, 8000); } catch (er) { fallo(er); t.disabled = false; }
    return;
  }
  if (t.id === "pyProbar") { const antes = t.innerHTML; t.disabled = true; t.innerHTML = `${icn("loader", "sm")}Probando…`; try { const r = await api("/api/pyro", { op: "probar" }); toast(`Pyro respondió en ${(r.ms / 1000).toFixed(1)} s: ${r.modelos} modelos.`); } catch (er) { fallo(er); } finally { t.disabled = false; t.innerHTML = antes; } return; }
  if (t.id === "pySync") { const antes = t.innerHTML; t.disabled = true; t.innerHTML = `${icn("loader", "sm")}Sincronizando…`; try { PY = await api("/api/pyro", { op: "sincronizar" }); toast(`Listo: ${PY.atadas} cuentas atadas`); refrescar(true); render(true); } catch (er) { fallo(er); t.disabled = false; t.innerHTML = antes; } return; }
  if (t.id === "pyQuitar") { if (!(await confirmar({ titulo: "¿Desconectar Pyro?", peligro: true, texto: "Se borra la clave guardada. Las cuentas siguen atadas a su modelo y el material que ya se trajo queda.", ok: "Desconectar" }))) return; try { PY = await api("/api/pyro", { op: "desconectar" }); toast("Pyro desconectado"); render(true); } catch (er) { fallo(er); } return; }
  if (d.pyauto !== undefined) { try { PY = await api("/api/pyro", { op: "material_auto", valor: d.pyauto === "1" }); render(true); } catch (er) { fallo(er); } return; }
  if (d.pycrear) { try { await api("/api/pyro", { op: "crear_cuenta", usuario: d.pycrear, modelo_id: Number(d.pymodelo) }); PY = null; toast(`@${d.pycrear} creada y atada a Pyro`); refrescar(true); render(true); } catch (er) { fallo(er); } return; }
  if (t.id === "ajGuardar") {
    try { AJ = await api("/api/ajustes", { app_id: $("#ajId").value, config_id: ($("#ajConfig") || {}).value || "", app_secret: $("#ajSecret").value }); toast("Guardado"); refrescar(true); render(true); } catch (er) { fallo(er); } return;
  }
});
// guardar el borrador del texto al salir del campo
document.addEventListener("focusout", e => { if (e.target.id === "caption" && abierta) { const p = S.piezas.find(x => x.id === abierta); if (p && p.caption !== e.target.value) { p.caption = e.target.value; api("/api/pieza", { op: "caption", id: abierta, caption: e.target.value }).catch(() => {}); } } });

// ---------- refresco ----------
async function refrescar(forzar) {
  try {
    const d = await api("/api/estado");
    S = d; S.todas = d.cuentas;
    if (espacio) S.cuentas = d.cuentas.filter(c => espDe(c) === espacio);
    if (S.cuentas.length && !cuenta(cuentaActiva)) cuentaActiva = S.cuentas[0].id;
    if (!espacio && !$("#dlgEsp")) elegirEspacio(true);
    const nf = JSON.stringify([pagina, cuentaActiva, S.cuentas, S.piezas.map(p => [p.id, p.estado, p.etapa, p.tipo, p.archivos, p.cuando, p.jueces && p.jueces.promedio, p.error, p.caption && p.caption.length]), S.claude, S.app]);
    const ae = document.activeElement;
    const editando = ae && ae.closest && ae.closest("#contenido") && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
    if ((forzar || nf !== firma) && !editando) { firma = nf; render(); }
    else if (abierta) pintarLateral();
    pintarChat();
  } catch (e) { console.warn("sin conexión con el panel", e); }
}
pintarTema();
refrescar(true);
setInterval(refrescar, 4000);
</script>
</body>
